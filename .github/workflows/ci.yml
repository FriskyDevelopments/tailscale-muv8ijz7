name: CI

on:
  push:
    branches: ["kiro/**", "quality", "main"]
  pull_request:
    branches: ["quality", "main"]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning install-tailscale.sh run-tailscale.sh

  docker-build-and-smoke:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    needs: shellcheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tailscale-exit-node:ci
          build-args: |
            TAILSCALE_VERSION=1.96.4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Smoke test 1: tailscale version matches TAILSCALE_VERSION ──────────
      - name: "Smoke 1: tailscale version"
        run: |
          expected="1.96.4"
          actual=$(docker run --rm tailscale-exit-node:ci /render/tailscale version | head -1)
          echo "Expected: ${expected}  Actual: ${actual}"
          [[ "${actual}" == "${expected}"* ]] || { echo "ERROR: version mismatch"; exit 1; }
          echo "PASSED"

      # ── Smoke test 2: _backend_state grep parsing (no python3/jq) ──────────
      # Feeds synthetic JSON into the same grep pipeline used in the health check.
      # Verifies it returns "Running", "NeedsLogin", and "error" correctly.
      - name: "Smoke 2: _backend_state grep parsing"
        run: |
          docker run --rm tailscale-exit-node:ci bash -c '
            set -euo pipefail
            _extract_state() {
              echo "$1" \
                | grep -Eo '"'"'"BackendState"[[:space:]]*:[[:space:]]*"[^"]*"'"'"' \
                | grep -Eo '"'"'"[^"]*"$'"'"' \
                | tr -d '"'"'"'"'"' \
                || echo "error"
            }
            running='"'"'{"BackendState": "Running", "TailscaleIPs": ["100.x.x.x"]}'"'"'
            needs_login='"'"'{"BackendState": "NeedsLogin"}'"'"'
            stopped='"'"'{"BackendState": "Stopped"}'"'"'
            bad='"'"'not json at all'"'"'

            r=$(_extract_state "$running");   [[ "$r" == "Running"    ]] || { echo "FAIL Running: got $r";    exit 1; }
            r=$(_extract_state "$needs_login"); [[ "$r" == "NeedsLogin" ]] || { echo "FAIL NeedsLogin: got $r"; exit 1; }
            r=$(_extract_state "$stopped");   [[ "$r" == "Stopped"    ]] || { echo "FAIL Stopped: got $r";    exit 1; }
            r=$(_extract_state "$bad");       [[ "$r" == "error"      ]] || { echo "FAIL bad-json: got $r";   exit 1; }
            echo "PASSED: all BackendState cases correct"
          '

      # ── Smoke test 3: run-tailscale.sh exits non-zero with no auth / no state ──
      - name: "Smoke 3: no-auth exits non-zero"
        run: |
          set +e
          output=$(docker run --rm \
            --cap-add=NET_ADMIN \
            -e TS_UP_MAX_ATTEMPTS=1 \
            -e TS_UP_TIMEOUT=5 \
            -e ADVERTISE_EXIT_NODE=true \
            tailscale-exit-node:ci \
            /render/run-tailscale.sh 2>&1)
          code=$?
          set -e
          echo "${output}" | tail -5
          echo "exit code: ${code}"
          [[ $code -ne 0 ]] || { echo "ERROR: expected non-zero exit, got 0"; exit 1; }
          echo "PASSED: exited ${code}"

      # ── Smoke test 4: OAuth without TS_TAGS gives clear error ──────────────
      - name: "Smoke 4: OAuth missing TS_TAGS"
        run: |
          set +e
          output=$(docker run --rm \
            -e TS_OAUTH_CLIENT_SECRET=fake-secret \
            tailscale-exit-node:ci \
            /render/run-tailscale.sh 2>&1)
          code=$?
          set -e
          echo "${output}"
          echo "exit code: ${code}"
          [[ $code -ne 0 ]] || { echo "ERROR: expected non-zero exit"; exit 1; }
          echo "${output}" | grep -q "TS_TAGS" || { echo "ERROR: missing TS_TAGS hint in output"; exit 1; }
          echo "PASSED"
